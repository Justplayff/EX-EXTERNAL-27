name: Build ZEX EXTERNAL IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (ldid)
        run: |
          brew install ldid

      - name: Run Build Script
        run: |
          chmod +x compile.sh
          ./compile.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEX-EXTERNAL-IPA
          path: ZEX_EXTERNAL.ipa

      - name: Release IPA directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: ZEX_EXTERNAL.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
